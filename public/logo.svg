<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e9f6e" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Pentagon (5-lobed NU-style green shield) -->
  <path d="M 250,15 
           C 340,15 450,120 480,200 
           C 500,250 470,360 410,430 
           C 360,480 300,485 250,485 
           C 200,485 140,480 90,430 
           C 30,360 0,250 20,200 
           C 50,120 160,15 250,15 Z" 
        fill="url(#greenGrad)" 
        stroke="#ffffff" 
        stroke-width="8" 
        filter="url(#dropShadow)" />
  
  <path d="M 250,22 
           C 335,22 440,125 470,202 
           C 488,248 460,352 403,420 
           C 355,468 295,475 250,475 
           C 205,475 145,468 97,420 
           C 40,352 12,248 30,202 
           C 60,125 165,22 250,22 Z" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="2" />

  <!-- The 9 Stars -->
  <!-- Top Center Star (Large) -->
  <polygon points="250,55 254,67 266,67 256,74 260,86 250,78 240,86 244,74 234,67 246,67" fill="#ffffff" stroke="#047857" stroke-width="1" />
  
  <!-- Left Side Stars (4) -->
  <polygon points="175,90 178,98 187,98 179,103 182,111 175,106 168,111 171,103 163,98 172,98" fill="#ffffff" />
  <polygon points="115,145 118,153 127,153 119,158 122,166 115,161 108,166 111,158 103,153 112,153" fill="#ffffff" />
  <polygon points="75,220 78,228 87,228 79,233 82,241 75,236 68,241 71,233 63,228 72,228" fill="#ffffff" />
  <polygon points="65,305 68,313 77,313 69,318 72,326 65,321 58,326 61,318 53,313 62,313" fill="#ffffff" />

  <!-- Right Side Stars (4) -->
  <polygon points="325,90 328,98 337,98 329,103 332,111 325,106 318,111 321,103 313,98 322,98" fill="#ffffff" />
  <polygon points="385,145 388,153 397,153 389,158 392,166 385,161 378,166 381,158 373,153 382,153" fill="#ffffff" />
  <polygon points="425,220 428,228 437,228 429,233 432,241 425,236 418,241 421,233 413,228 422,228" fill="#ffffff" />
  <polygon points="435,305 438,313 447,313 439,318 442,326 435,321 428,326 431,318 423,313 432,313" fill="#ffffff" />

  <!-- Central White Circle -->
  <circle cx="250" cy="265" r="130" fill="#ffffff" stroke="#047857" stroke-width="4" />
  <circle cx="250" cy="265" r="124" fill="url(#skyGrad)" stroke="#ffffff" stroke-width="2" />

  <!-- Globe / Earth Lines -->
  <path d="M 126,265 A 124,124 0 0,0 374,265" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 150,200 Q 250,240 350,200" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 150,330 Q 250,290 350,330" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 250,141 V 389" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 250,141 Q 200,265 250,389" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 250,141 Q 300,265 250,389" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Mosque Building & Minaret -->
  <!-- Mosque base structure -->
  <rect x="200" y="225" width="100" height="40" fill="#854d0e" stroke="#451a03" stroke-width="2" rx="2" />
  <rect x="210" y="205" width="80" height="20" fill="#a16207" stroke="#451a03" stroke-width="1.5" />
  
  <!-- Minaret -->
  <rect x="235" y="160" width="12" height="45" fill="#ca8a04" stroke="#451a03" stroke-width="1.5" />
  <polygon points="232,160 241,145 250,160" fill="#ea580c" stroke="#451a03" stroke-width="1.5" />
  <circle cx="241" cy="170" r="3" fill="#fef08a" />

  <!-- Mosque Dome -->
  <path d="M 215,205 C 215,175 285,175 285,205 Z" fill="url(#goldGrad)" stroke="#451a03" stroke-width="2" />
  <!-- Dome spike/crescent -->
  <line x1="250" y1="175" x2="250" y2="165" stroke="#451a03" stroke-width="2" />
  <circle cx="250" cy="163" r="2.5" fill="#ca8a04" />

  <!-- Open Quran Book (left) -->
  <g transform="translate(145, 230) scale(0.65)">
    <!-- Book Stand (Rehal) -->
    <polygon points="10,50 35,25 60,50 50,60 35,45 20,60" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <polygon points="60,50 35,25 10,50 20,60 35,45 50,60" fill="#92400e" stroke="#451a03" stroke-width="1.5" opacity="0.8" />
    
    <!-- Left Page -->
    <path d="M 35,25 C 25,18 10,22 5,35 L 5,15 C 10,2 25, -2 35,5 Z" fill="#fffef0" stroke="#451a03" stroke-width="1.5" />
    <!-- Right Page -->
    <path d="M 35,25 C 45,18 60,22 65,35 L 65,15 C 60,2 45, -2 35,5 Z" fill="#fffef0" stroke="#451a03" stroke-width="1.5" />
    
    <!-- Script lines -->
    <line x1="10" y1="12" x2="28" y2="17" stroke="#451a03" stroke-width="1" />
    <line x1="12" y1="18" x2="28" y2="23" stroke="#451a03" stroke-width="1" />
    <line x1="10" y1="24" x2="28" y2="29" stroke="#451a03" stroke-width="1" />
    
    <line x1="60" y1="12" x2="42" y2="17" stroke="#451a03" stroke-width="1" />
    <line x1="58" y1="18" x2="42" y2="23" stroke="#451a03" stroke-width="1" />
    <line x1="60" y1="24" x2="42" y2="29" stroke="#451a03" stroke-width="1" />
  </g>

  <!-- Green Quill Pen (left side of book) -->
  <path d="M 135,285 C 145,260 160,240 185,225" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 135,285 C 137,280 143,275 145,270 C 147,265 146,260 145,255" fill="none" stroke="#16a34a" stroke-width="1.5" />

  <!-- Letters "N" and "U" -->
  <text x="148" y="320" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1e293b">N</text>
  <text x="328" y="320" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1e293b">U</text>

  <!-- Circular Text Path for PONDOK PESANTREN TAHFIZHUL QUR'AN -->
  <path id="textPath" d="M 140,240 A 115,115 0 0,1 360,240" fill="none" stroke="none" />
  <text fill="#1e293b" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      PONDOK PESANTREN TAHFIZHUL QUR'AN
    </textPath>
  </text>

  <!-- Flying Eagle in Foreground -->
  <g transform="translate(250, 310) scale(1.1)">
    <!-- Eagle Wings -->
    <!-- Left Wing -->
    <path d="M 0,-15 C -35,-35 -75,-25 -95,-10 C -70,-5 -45,-10 -25,-12 Z" fill="#78350f" stroke="#451a03" stroke-width="1" />
    <!-- Right Wing -->
    <path d="M 0,-15 C 35,-35 75,-25 95,-10 C 70,-5 45,-10 25,-12 Z" fill="#78350f" stroke="#451a03" stroke-width="1" />
    <!-- Eagle Body & Head -->
    <ellipse cx="0" cy="-10" rx="10" ry="16" fill="#92400e" stroke="#451a03" stroke-width="1" />
    <circle cx="0" cy="-22" r="7" fill="#ffffff" stroke="#451a03" stroke-width="1" />
    <!-- Beak -->
    <polygon points="-2,-24 0,-29 2,-24" fill="#f59e0b" />
    <!-- Tail -->
    <polygon points="-8,6 0,22 8,6" fill="#78350f" stroke="#451a03" stroke-width="1" />

    <!-- Blue Badge 39 -->
    <circle cx="0" cy="18" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="black" fill="#ffffff" text-anchor="middle">39</text>
  </g>

  <!-- Yellow Banner for AL-HUSNA -->
  <g filter="url(#dropShadow)">
    <!-- Left ribbon tail -->
    <polygon points="110,385 130,355 150,375" fill="#d97706" />
    <!-- Right ribbon tail -->
    <polygon points="390,385 370,355 350,375" fill="#d97706" />
    
    <!-- Central ribbon body -->
    <path d="M 130,355 Q 250,385 370,355 L 355,395 Q 250,425 145,395 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    
    <!-- Text on Banner -->
    <text x="250" y="388" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">
      AL-HUSNA
    </text>
  </g>

  <!-- White Label for BUKIT RAJAWALI -->
  <g transform="translate(140, 422)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="220" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="110" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
      BUKIT RAJAWALI
    </text>
  </g>
</svg>
